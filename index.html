<script>
// ============================================================
// JPE WRESTLING GM v83 Core Index
// Continuing to patch notes (merch interest + enhanced risky training from pt9, safe Gamma roster filter, etc.)
// Building on previous: styles, positions, XP, brand, equipment, autoGM, rivalries, monthly roster, etc.

// ============================================================
// DOM CACHE (perf) — cache stable top-level nodes once instead of
// re-querying the document on every render. Dynamic per-render nodes
// (the ones rebuilt inside a tab) are looked up through el() so there
// is a single choke point to optimize later if needed.
// ============================================================
const DOM = {};
function cacheDOM() {
    DOM.mainContent  = document.getElementById('mainContent');
    DOM.headerInfo   = document.getElementById('headerInfo');
    DOM.navButtons   = Array.from(document.querySelectorAll('.nav-btn'));
    DOM.profileModal = document.getElementById('profileModal');
    DOM.modalName    = document.getElementById('modalName');
    DOM.tabStats     = document.getElementById('tab-stats');
    DOM.tabMoves     = document.getElementById('tab-moves');
    DOM.tabStyle     = document.getElementById('tab-style');
    DOM.tabRivalries = document.getElementById('tab-rivalries');
}
// Thin pass-through for dynamic (rebuilt-per-render) elements. Centralized
// so future caching/diffing can hook here without touching call sites.
function el(id) { return document.getElementById(id); }
// Safe name -> DOM-id fragment (wrestler names may contain spaces).
function domId(name) { return String(name).replace(/[^a-zA-Z0-9]/g, '_'); }

// === FEATURE FLAGS + BRAND_COLORS + BRAND_META moved to gamestate.js (Phase 2) ===

// === SPRITES REMOVED (Phase 1.3) ===
// All sprite code stripped for simplicity. Using only emoji icons.
// (figureTemplates, initSpriteRegistry, getWrestlerSprite removed)
function renderBookingPreviewCard(name, brandColor) {
    if (!name) return `<div style="flex:1; background:#111; border-radius:10px; border:2px dashed #333; display:flex; align-items:center; justify-content:center; min-height:90px; color:#444; font-size:0.8rem; text-align:center; padding:10px;">Select a wrestler</div>`;
    const w = getWrestler(name);
    if (!w) return '';
    const isChamp = game.champions && game.champions["JPE World"] === w.name;
    const hotEmoji = (w.hot || 0) > 2 ? "🔥" : (w.hot || 0) < -1 ? "❄️" : "";
    const fat = w.fatigue || 0;
    const fatColor = fat > 55 ? "#ff6666" : fat > 30 ? "#ffaa00" : "#00ff85";
    const eq = w.equipment || {level:1};
    return `
        <div style="flex:1; background:#111; border-radius:10px; border:2px solid ${brandColor}55; padding:10px; min-height:90px; position:relative; overflow:hidden;">
            ${isChamp ? `<div style="position:absolute;top:4px;right:6px;font-size:0.6rem;color:#ffd700;font-weight:700;">★ CHAMP</div>` : ''}
            <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">
                <span style="font-size:1.5rem;line-height:1;">${getWrestlerIcon(name)}</span>
                <div>
                    <div style="font-weight:700; font-size:0.9rem; color:${w.color};">${w.name} ${hotEmoji}</div>
                    <div style="font-size:0.7rem; color:#666;">${w.brand} • Lv${w.level || 1} ${w.tier ? "• " + w.tier : ""}</div>
                </div>
            </div>
            <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:2px 6px; font-size:0.7rem; color:#888;">
                <span>Pop <strong style="color:#ff6200;">${w.popularity}</strong></span>
                <span>IR <strong style="color:#eee;">${w.inRing}</strong></span>
                <span>Promo <strong style="color:#eee;">${w.promo}</strong></span>
                <span>Hot <strong style="color:#eee;">${w.hot > 0 ? '+' : ''}${w.hot}</strong></span>
                <span>Fat <strong style="color:${fatColor};">${fat}%</strong></span>
                <span>CR <strong style="color:#ffd700;">${w.careerRating || 0}</strong></span>
            </div>
        </div>`;
}

// === WRESTLER_ICONS + getWrestlerIcon + wrestlerDatabase + getWrestlerTemplate + spawnWrestlerFromDB + createWrestler moved to gamestate.js (Phase 2) ===

// === JPEFinancialEconomy class + `financialEconomy` instance moved to financials.js (Phase 1) ===

// === Core `game` state object moved to gamestate.js (Phase 2) ===

// === FOUNDATION SYSTEMS (brand values + belts) moved to gamestate.js (Phase 2) ===
// (getBrandValue, adjustBrandValue, updateBrandValuesAfterShow, getBelt, changeChampion, defendTitle, getBeltPrestigeBonus)

// === v44 BRAND MONEY HELPERS moved to financials.js (Phase 1): getBrandKey, addBrandMoney, getBrandMoney ===

function trainStat(wrestlerName, statKey) {
    const w = getWrestler(wrestlerName);
    if (!w || (w.trainingPoints || 0) <= 0 || !w.stats || !w.stats[statKey]) return false;
    w.stats[statKey] = Math.min(99, w.stats[statKey] + 2);
    w.trainingPoints--;
    if (statKey === "inRing") w.inRing = Math.min(99, (w.inRing || 70) + 1);
    if (statKey === "promo") w.promo = Math.min(99, (w.promo || 60) + 1);
    return true;
}

// ==================== v83 PATCH: ENHANCED TRAINING WITH RISK from pt9 note ====================
// Risky training types for dramatic progression (vibe: high reward, injury risk)
const TRAINING_TYPES = {
  "InRingDrill": { stat: "inRing", gain: 3, risk: 0.08, cost: 0, desc: "Heavy in-ring work" },
  "PromoSchool": { stat: "promo", gain: 3, risk: 0.03, cost: 0, desc: "Mic and character work" },
  "Conditioning": { stat: "stamina", gain: 3, risk: 0.05, cost: 0, desc: "Cardio & durability" },
  "GimmickWork": { stat: "charisma", gain: 3, risk: 0.04, cost: 0, desc: "Character & presentation" },
  "HighIntensity": { stat: "inRing", gain: 5, risk: 0.22, cost: 0, desc: "Risky but high reward" }
};

function performTraining(wrestlerName, trainingType = "InRingDrill") {
  const w = getWrestler(wrestlerName);
  if (!w) return { success: false, reason: "Wrestler not found" };
  const training = TRAINING_TYPES[trainingType];
  if (!training) return { success: false, reason: "Invalid training type" };
  if ((w.trainingPoints || 0) < 1) {
    return { success: false, reason: "No training points remaining" };
  }
  w.trainingPoints--;
  let gained = training.gain;
  let injured = false;
  let message = `${w.name} trained ${trainingType}.`;
  if (Math.random() < training.risk) {
    if (trainingType === "HighIntensity") {
      w.condition = "Injured";
      if (!w.injury) w.injury = { name: "Training Injury", severity: "Minor", daysLeft: 7 };
      injured = true;
      message = `${w.name} got injured during high intensity training!`;
    } else {
      gained = Math.max(1, gained - 1);
      message = `${w.name} had a rough session.`;
    }
  }
  if (w.stats && w.stats[training.stat] !== undefined) {
    w.stats[training.stat] = Math.min(99, w.stats[training.stat] + gained);
  }
  if (training.stat === "inRing") w.inRing = Math.min(99, (w.inRing || 70) + gained);
  else if (training.stat === "promo") w.promo = Math.min(99, (w.promo || 60) + gained);
  else if (training.stat === "stamina") w.stamina = Math.min(99, (w.stamina || 65) + gained);
  else if (training.stat === "charisma") w.charisma = Math.min(99, (w.charisma || 60) + gained);

  if (!injured && Math.random() < 0.18) {
    w.hot = Math.min(6, (w.hot || 0) + 1);
    message += " Feeling motivated!";
  }
  if (!game.trainingLog) game.trainingLog = [];
  game.trainingLog.unshift({
    day: game.date.day || 0,
    wrestler: w.name,
    type: trainingType,
    stat: training.stat,
    gained: gained
  });
  if (game.trainingLog.length > 12) game.trainingLog.pop();
  return {
    success: true,
    wrestler: w.name,
    stat: training.stat,
    gained,
    injured,
    message
  };
}

function getAvailableTrainingTypes() {
  return Object.keys(TRAINING_TYPES);
}

// === v38 ECONOMY + BRAND INCOME SPLIT + MERCH INTEREST/REVENUE/FORECAST moved to financials.js (Phase 1) ===
// (getDailyIncome, calculateBrandIncome, accrueMerchInterest, collectMerchRevenue, getUncollectedMerchTotal, forecastNextDayIncome)

let matchBuilder = { w1: null, w2: null };
let pendingTitleMatch = false;
let currentTab = 0;

// === jokerList + ppvList + getWrestler moved to gamestate.js (Phase 2) ===

// === Phase 2.3: System objects (own logic, central game state) ===
const SimulationEngine = {
  resolve: calculateMatchOutcome,
  performance: calculatePerformance,
  apply: applyShowResults,
  showStats: calculateShowStats
};

const BookingSystem = {
  getRosterForBrand: getBrandRosterForBooking,
  addMatch: (w1, w2, pos, isTitle) => {
    game.bookedMatches.push({w1, w2, position: pos, isTitle: !!isTitle});
  }
};

const RosterSystem = {
  get: getWrestler,
  safeStat: safeStatChange
};

// (EconomySystem etc can follow same pattern)

console.log('%c[Systems] SimulationEngine, BookingSystem, RosterSystem initialized (Phase 2.3)', 'color:#0a0');

// === Phase 3: Common utilities (safe ops) ===
function safeStatChange(wrestler, key, amount) {
    if (!wrestler) return 0;
    const before = (wrestler.stats && key in wrestler.stats) ? wrestler.stats[key] : (wrestler[key] || 0);
    let val = before + amount;
    val = Math.max(0, Math.min(99, val));
    if (wrestler.stats && key in wrestler.stats) wrestler.stats[key] = val;
    if (key in wrestler) wrestler[key] = val;
    return val - before;
}
function adjustRivalry(a, b, amt) { increaseRivalry(a, b, amt); }

// === CATEGORIZED LOGGER + WRESTLER DEVELOPMENT LOG + WEEKLY RECAP moved to gamestate.js (Phase 2) ===
// (JPE_LOG, logWrestlerDevelopment, checkWeeklyRecap)
function isWrestlerBooked(name) {
    return game.bookedMatches.some(m => m.w1 === name || m.w2 === name) || matchBuilder.w1 === name || matchBuilder.w2 === name;
}

function getBrandColor(brand) { return BRAND_COLORS[brand] || "#888888"; }
function setActiveShowBrand(brand) { game.activeShowBrand = brand; showTab(2); }
function getBrandRosterForBooking() {
    if (game.activeShowBrand === "Any") return game.wrestlers;
    return game.wrestlers.filter(w => w.brand === game.activeShowBrand || w.brand === "Free Agents");
}

function getSortedWrestlers(mode = 'popularity') {
    return [...game.wrestlers].sort((a, b) => {
        if (mode === 'popularity') return b.popularity - a.popularity;
        if (mode === 'career') return (b.careerRating || 0) - (a.careerRating || 0);
        return 0;
    });
}

function filterRoster() {
    renderFilteredRoster();
}

// updateRosterList(): canonical partial updater for the roster tab.
// Only rewrites the inner list container — never the whole tab.
function updateRosterList() { renderFilteredRoster(); }

// Inner markup of a single roster card (reused by full render + single-card patch).
function rosterCardInner(w) {
    const isChamp = game.champions && game.champions["JPE World"] === w.name;
    const eq = w.equipment || {level:1};
    const tp = w.trainingPoints || 0;
    const onFocus = game.merchFocus.includes(w.name);
    const focusFull = game.merchFocus.length >= 3 && !onFocus;
    const nm = w.name.replace(/'/g, "\\'");
    return `
        <div style="display:flex; align-items:center; gap:10px;" onclick="showWrestlerProfile('${nm}')">
            <span class="wrestler-icon">${getWrestlerIcon(w.name)}</span>
            <div style="flex:1;">
                <strong>${w.name}</strong> <span style="color:#666;">(${w.brand})</span> ${isChamp ? '<span style="color:#ffd700;">★</span>' : ''}
                <div style="font-size:0.85rem; color:#ffd700;">Career ${w.careerRating || 0} • Fan +${w.fanBonus || 0}</div>
                <div style="font-size:0.75rem; color:#888;">Pop ${w.popularity} • Hot ${w.hot || 0} • Lv${eq.level} ${eq.name} • TP ${tp}</div>
            </div>
        </div>
        <div style="display:flex; gap:6px; margin-top:8px;">
            <button class="small" onclick="event.stopPropagation(); quickTrain('${nm}')" ${tp <= 0 ? 'disabled style="opacity:0.4;"' : ''}>⚡ Train</button>
            <button class="small ${onFocus ? 'gold' : ''}" onclick="event.stopPropagation(); quickToggleMerch('${nm}')" ${focusFull ? 'disabled style="opacity:0.4;"' : ''}>💰 ${onFocus ? 'Focused' : 'Merch'}</button>
            <button class="small" onclick="event.stopPropagation(); quickBook('${nm}')" style="background:${w.color}22; color:${w.color};">📋 Book</button>
        </div>`;
}

function renderFilteredRoster() {
    const container = el('rosterList');
    if (!container) return;

    const search = (el('rosterSearch')?.value || '').toLowerCase();
    const brandFilter = el('rosterBrandFilter')?.value || '';

    let filtered = getSortedWrestlers('career');
    if (search) filtered = filtered.filter(w => w.name.toLowerCase().includes(search));
    if (brandFilter) filtered = filtered.filter(w => w.brand === brandFilter);

    let listHTML = '';
    filtered.forEach(w => {
        const isChamp = game.champions && game.champions["JPE World"] === w.name;
        listHTML += `<div class="wrestler-card" id="rcard-${domId(w.name)}" style="border-left-color:${w.color}${isChamp ? '; box-shadow:0 0 12px #ffd700' : ''}">${rosterCardInner(w)}</div>`;
    });
    container.innerHTML = listHTML || `<div class="card" style="text-align:center;color:#666;">No wrestlers match your filters</div>`;
}

// Patch ONE card in place — no list rebuild, no node churn.
function updateRosterCard(name) {
    const card = el('rcard-' + domId(name));
    const w = getWrestler(name);
    if (!card || !w) return;
    card.innerHTML = rosterCardInner(w);
}

// ==================== ROSTER QUICK ACTIONS ====================
// Lightweight feedback toast so quick actions feel responsive without alert() spam.
function quickToast(msg, color = '#00ff85') {
    let t = el('quickToast');
    if (!t) {
        t = document.createElement('div');
        t.id = 'quickToast';
        t.style.cssText = 'position:fixed; left:50%; transform:translateX(-50%); bottom:104px; background:#111; border:1px solid #333; color:#eee; padding:9px 16px; border-radius:999px; font-size:0.82rem; z-index:300; box-shadow:0 4px 18px rgba(0,0,0,0.5); transition:opacity 0.25s; pointer-events:none;';
        document.body.appendChild(t);
    }
    t.style.borderColor = color;
    t.innerHTML = msg;
    t.style.opacity = '1';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.style.opacity = '0'; }, 1500);
}

// Quick Train: spend 1 TP on the wrestler's lowest core stat.
function quickTrain(name) {
    const w = getWrestler(name);
    if (!w) return;
    if ((w.trainingPoints || 0) <= 0) { quickToast(`${name} has no training points`, '#ff6666'); return; }
    // v83 PATCH: use enhanced with risk from pt9
    const result = performTraining(name, "InRingDrill"); // default, or could prompt
    saveGame();
    updateRosterCard(name);
    if (result.success) {
        quickToast(result.message, result.injured ? '#ff6666' : '#00ff85');
        if (typeof updateMerchMeter === 'function') updateMerchMeter();
    } else {
        quickToast(result.reason || 'Training failed', '#ff6666');
    }
}

function levelUpEquipment(w) {
    if (!w.equipment) w.equipment = {type: "attire", level: 1, name: "Basic Gear"};
    const pop = w.popularity || 60;
    let newLevel = pop >= 90 ? 4 : pop >= 80 ? 3 : pop >= 70 ? 2 : 1;
    if (newLevel > w.equipment.level) {
        w.equipment.level = newLevel;
        w.equipment.name = w.equipment.type === "weapon" 
            ? ["Steel Chair","Chain","Golden Gauntlet","Lariat Rope","Switchblade"][Math.floor(Math.random()*5)]
            : ["Leather Jacket","Neon Tights","Power Suit","Camo Gear","Shadow Cloak"][Math.floor(Math.random()*5)];
        return true;
    }
    return false;
}

function getEquipmentBonus(w, position) {
    if (!w.equipment || game.noEquipmentNight) return 0;
    let bonus = (w.equipment.level || 1) * 3;
    if (w.equipment.type === "weapon") {
        bonus = (position === "opener" || position === "main") ? bonus + (w.equipment.level * 4) : Math.floor(bonus * 0.3);
    } else {
        bonus += 2;
    }
    return bonus;
}

function getRivalryKey(w1, w2) { return [w1.name || w1, w2.name || w2].sort().join("|"); }
function getRivalryScore(w1, w2) { return game.rivalries[getRivalryKey(w1, w2)] || 0; }
function increaseRivalry(w1, w2, amount) {
    const key = getRivalryKey(w1, w2);
    game.rivalries[key] = Math.min(100, (game.rivalries[key] || 0) + amount);
}
function decayRivalries() {
    Object.keys(game.rivalries).forEach(key => {
        const [n1, n2] = key.split("|");
        const wasInShow = game.bookedMatches.some(m => (m.w1 === n1 && m.w2 === n2) || (m.w1 === n2 && m.w2 === n1));
        if (!wasInShow) game.rivalries[key] = Math.max(0, game.rivalries[key] - (8 + Math.floor(Math.random()*5)));
    });
}
function updateMerchMeter() {
    let avg = 0;
    const keys = Object.keys(game.rivalries);
    if (keys.length) avg = keys.reduce((s, k) => s + game.rivalries[k], 0) / keys.length;
    game.merchMeter = Math.max(40, Math.min(100, Math.floor(55 + (avg * 0.35) + (game.merchFocus.length * 8))));
}

function resolveMatchOutcome(w1, w2, position = "undercard") {
    let s1 = w1.popularity + (w1.hot * 6) + (w1.inRing * 0.9) + (w1.charisma * 0.4) + ((w1.careerRating || 70) - 70) * 0.12 + getRivalryScore(w1, w2) * 0.08 + getEquipmentBonus(w1, position) + getBeltPrestigeBonus(w1.name) * 1.5;
    let s2 = w2.popularity + (w2.hot * 6) + (w2.inRing * 0.9) + (w2.charisma * 0.4) + ((w2.careerRating || 70) - 70) * 0.12 + getRivalryScore(w2, w1) * 0.08 + getEquipmentBonus(w2, position) + getBeltPrestigeBonus(w2.name) * 1.5;
    if (Object.values(game.champions).includes(w1.name)) s1 += 15;
    if (Object.values(game.champions).includes(w2.name)) s2 += 15;
    s1 += Math.random() * 16 - 8;
    s2 += Math.random() * 16 - 8;
    return s1 >= s2 ? { winner: w1.name, loser: w2.name } : { winner: w2.name, loser: w1.name };
}

function calculateShowStats(booked) {
    if (!booked || booked.length === 0) return { rating: 35, numMatches: 0 };
    let ratings = [];
    booked.forEach(m => {
        const w1 = getWrestler(m.w1), w2 = getWrestler(m.w2);
        if (!w1 || !w2) return;
        let r = Math.floor((w1.popularity + w2.popularity) / 2) + (w1.hot > 2 ? 7 : 0) + (w2.hot > 2 ? 7 : 0) + Math.floor((w1.inRing + w2.inRing) / 18);
        const pos = m.position || "undercard";
        if (pos === "main") r += 18;
        else if (pos === "opener") r += Math.floor(r * 0.12);
        else r += 4;
        ratings.push(r);
    });
    const avg = Math.floor(ratings.reduce((a,b)=>a+b,0) / ratings.length);
    let rating = Math.max(35, Math.min(100, Math.floor(booked.length * 8 + avg * 0.55)));
    return { rating, numMatches: booked.length };
}

// === Phase 2.1: Pure calculation functions (no side effects) ===
// These are extracted from the old monolithic progression for clarity, testability, and future expansion.

function calculateMatchOutcome(w1, w2, position = "undercard") {
    let s1 = w1.popularity + (w1.hot * 6) + (w1.inRing * 0.9) + (w1.charisma * 0.4) + ((w1.careerRating || 70) - 70) * 0.12 + getRivalryScore(w1, w2) * 0.08 + getEquipmentBonus(w1, position) + getBeltPrestigeBonus(w1.name) * 1.5;
    let s2 = w2.popularity + (w2.hot * 6) + (w2.inRing * 0.9) + (w2.charisma * 0.4) + ((w2.careerRating || 70) - 70) * 0.12 + getRivalryScore(w2, w1) * 0.08 + getEquipmentBonus(w2, position) + getBeltPrestigeBonus(w2.name) * 1.5;
    if (Object.values(game.champions).includes(w1.name)) s1 += 15;
    if (Object.values(game.champions).includes(w2.name)) s2 += 15;
    s1 += Math.random() * 16 - 8;
    s2 += Math.random() * 16 - 8;
    return s1 >= s2 ? { winner: w1.name, loser: w2.name } : { winner: w2.name, loser: w1.name };
}

function calculatePerformance(w1, w2, winnerName, isMain, isTitle, position) {
    const win = winnerName === w1.name ? w1 : w2;
    const lose = winnerName === w1.name ? w2 : w1;
    let sc = 4.8 + (win.inRing - 68) * 0.032 + (win.charisma - 62) * 0.022 + (win.hot || 0) * 0.48 + ((win.popularity || 60) - (lose.popularity || 60)) * 0.018;
    if ((win.fatigue || 0) > 50) sc -= ((win.fatigue || 0) - 50) * 0.028;
    const riv = getRivalryScore(win, lose);
    if (riv >= 40) sc += (riv - 40) * 0.012;
    if (isMain) sc += 1.8;
    if (isTitle && position === "main") sc += 1.2;
    if (position === "main") sc += 1.4;
    if (position === "opener") sc += 0.8;
    if (position === "undercard") sc -= 0.3;
    sc += Math.random() * 1.7 - 0.85;
    return Math.max(1, Math.min(10, Math.round(sc * 10) / 10));
}

function calculateCareerGains(winner, loser, perf, isMain, isTitle, pos) {
    let winD = 6 + Math.floor((perf - 6) * 1.1);
    let loseD = 4.6 + Math.floor((perf - 5.5) * 0.55);
    if (isMain) winD += 1;
    if (isTitle && pos === "main") winD += 2;
    return {
        winner: Math.round(winD),
        loser: Math.round(Math.max(-3, loseD))
    };
}

function calculateFatigueCost(pos) {
    if (pos === "main") return 38;
    if (pos === "opener") return 18;
    return 22;
}

function calculateStreakChanges(out, m) {
    if (out.winner === m.w1) {
        return { w1: Math.min(8, (getWrestler(m.w1).streak || 0) + 1), w2: Math.max(-4, (getWrestler(m.w2).streak || 0) - 1.2) };
    } else {
        return { w2: Math.min(8, (getWrestler(m.w2).streak || 0) + 1), w1: Math.max(-4, (getWrestler(m.w1).streak || 0) - 1.2) };
    }
}

// Orchestrator (Phase 2.1)
function applyShowResults(booked, isTitle) {
    const stats = calculateShowStats(booked);
    const perfs = {};
    const deltas = {};
    const outcomes = {};

    booked.forEach((m, i) => {
        const w1 = getWrestler(m.w1), w2 = getWrestler(m.w2);
        if (!w1 || !w2) return;
        const pos = m.position || "undercard";
        const isMain = pos === "main" || (i === booked.length - 1 && booked.length >= 3);

        const out = calculateMatchOutcome(w1, w2, pos); // pure
        outcomes[i] = out;

        const perf = calculatePerformance(w1, w2, out.winner, isMain, isTitle && pos === "main", pos);
        perfs[i] = perf;

        const winner = getWrestler(out.winner);
        const loser = getWrestler(out.loser);
        if (!winner || !loser) return;

        const gains = calculateCareerGains(winner, loser, perf, isMain, isTitle, pos);
        winner.careerRating = Math.round((winner.careerRating || 70) + gains.winner);
        loser.careerRating = Math.round((loser.careerRating || 70) + gains.loser);

        const fanG = Math.max(0, Math.floor((perf - 5) * 2.4)) + (isMain ? 3 : 0) + (isTitle && pos === "main" ? 6 : 0);
        winner.fanBonus = (winner.fanBonus || 0) + fanG;

        const fatCost = calculateFatigueCost(pos);
        w1.fatigue = (w1.fatigue || 0) + fatCost;
        w2.fatigue = (w2.fatigue || 0) + fatCost;

        const streaks = calculateStreakChanges(out, m);
        if (out.winner === m.w1) {
            w1.streak = streaks.w1; w2.streak = streaks.w2;
        } else {
            w2.streak = streaks.w2; w1.streak = streaks.w1;
        }

        increaseRivalry(w1, w2, Math.floor(perf * 2.5) + 5);
        deltas[m.w1] = { perf, career: gains.winner, fan: fanG };
        deltas[m.w2] = { perf, career: gains.loser, fan: 0 };

        levelUpEquipment(winner);
        levelUpEquipment(loser);
    });

    // non-booked recovery
    game.wrestlers.forEach(w => {
        if (!booked.some(m => m.w1 === w.name || m.w2 === w.name)) w.fatigue = Math.max(0, (w.fatigue || 0) - 32);
    });
    decayRivalries();
    updateMerchMeter();

    return { deltas, performances: perfs, outcomes, rating: stats.rating };
}

// Legacy wrapper for compat (calls new orchestrator)
function applyPostShowProgression(booked, stats, isTitle) {
    return applyShowResults(booked, isTitle);
}

function doSimpleTraining(name, statKey) {
    const w = getWrestler(name);
    if (!w) return alert("Wrestler not found");
    if (w.injury) return alert(`${name} is injured and cannot train.`);
    if ((w.trainingPoints || 0) <= 0) return alert(`${name} has no training points left. Run shows to earn more.`);

    const stats = w.stats || (w.stats = {inRing: w.inRing||70, promo: w.promo||60, stamina: w.stamina||65, charisma: w.charisma||60});
    if (!stats[statKey]) stats[statKey] = 70;

    stats[statKey] = Math.min(99, stats[statKey] + 2);
    if (statKey === 'inRing') w.inRing = stats.inRing;
    if (statKey === 'promo') w.promo = stats.promo;
    if (statKey === 'stamina') w.stamina = stats.stamina;
    if (statKey === 'charisma') w.charisma = stats.charisma;

    w.trainingPoints--;
    w.fatigue = Math.min(100, (w.fatigue || 0) + 8);

    alert(`${name} trained ${statKey.toUpperCase()} +2! (TP left: ${w.trainingPoints})`);
    if (currentTab === 3) showTab(3); // refresh Train tab
    saveGame();
}

function trainAllAvailable() {
    let trained = 0;
    game.wrestlers.forEach(w => {
        if ((w.trainingPoints || 0) > 0 && !w.injury && (w.fatigue || 0) < 50) {
            const stats = w.stats || (w.stats = {inRing: w.inRing||70, promo: w.promo||60, stamina: w.stamina||65, charisma: w.charisma||60});
            const lowest = Object.keys(stats).reduce((a,b) => stats[a] <= stats[b] ? a : b);
            stats[lowest] = Math.min(99, stats[lowest] + 2);
            if (lowest === 'inRing') w.inRing = stats.inRing;
            if (lowest === 'promo') w.promo = stats.promo;
            if (lowest === 'stamina') w.stamina = stats.stamina;
            if (lowest === 'charisma') w.charisma = stats.charisma;
            w.trainingPoints--;
            w.fatigue = Math.min(100, (w.fatigue || 0) + 5);
            trained++;
        }
    });
    alert(`Trained ${trained} wrestler(s) on their weakest stat.`);
    if (currentTab === 3) showTab(3);
    saveGame();
}

function processInjuryRecovery() {
    game.wrestlers.forEach(w => {
        if (w.injury) {
            w.injury.daysLeft--;
            if (w.injury.daysLeft <= 0) {
                if (w.injury.originalStats) {
                    w.inRing = w.injury.originalStats.inRing;
                    w.promo = w.injury.originalStats.promo;
                    w.stamina = w.injury.originalStats.stamina;
                }
                delete w.injury;
            }
        }
    });
}

function advanceDay(silent = false) {
    const income = getDailyIncome();
    game.money += income.total;
    if (income.brandShares && game.brandMoney) {
        game.brandMoney.meltdown  += income.brandShares.meltdown;
        game.brandMoney.grandSlam += income.brandShares.grandSlam;
        game.brandMoney.gamma     += income.brandShares.gamma;
    }
    // Background training & recovery (light passive development)
    game.wrestlers.forEach(w => {
        w.fatigue = Math.max(0, (w.fatigue || 0) - 25);
        // Passive training: if they have TP and aren't exhausted, small chance to auto-train lowest stat
        if ((w.trainingPoints || 0) > 0 && (w.fatigue || 0) < 40 && Math.random() < 0.18) {
            if (!w.stats) w.stats = {inRing: w.inRing||70, promo: w.promo||60, stamina: w.stamina||65, charisma: w.charisma||60};
            const lowest = Object.keys(w.stats).reduce((a,b) => w.stats[a] <= w.stats[b] ? a : b);
            w.stats[lowest] = Math.min(99, (w.stats[lowest]||70) + 1);
            if (lowest === 'inRing') w.inRing = Math.min(99, (w.inRing||70) + 1);
            if (lowest === 'promo') w.promo = Math.min(99, (w.promo||60) + 1);
            w.trainingPoints--;
            logWrestlerDevelopment(w.name, "passive", 1, `Background training (${lowest})`);
        }
    });

    // v83 PATCH: accrue merch interest on advance (from pt9)
    if (typeof accrueMerchInterest === 'function') accrueMerchInterest();

    // v83 PATCH: Notes 11/12 - optional idle income via class (non-breaking, educational encapsulation)
    if (financialEconomy && typeof financialEconomy.add_idle_income === 'function') {
        financialEconomy.add_idle_income(1); // 1 "day" unit on advance
    }
    game.date.day++;
    if (game.date.day > 30) { game.date.day = 1; game.date.month++; if (game.date.month > 12) { game.date.month = 1; game.date.year++; } }
    checkWeeklyRecap();
    saveGame();
    if (!silent) showTab(0);
}

        if (w.sprite) { delete w.sprite; fixed = true; }
        if (fixed) repairs.push(`wrestler:${w.name}`);
    });

    updateMerchMeter();
    setInterval(() => { if (game) saveGame(); }, 30000);

// Factory — produces a forward-compatible segment. Defaults reproduce the
// current simple match exactly, so this can replace the {w1,w2,...} literal
// in addCurrentMatchFromUI() the day FEATURES.detailedBook flips on.
function createSegment(opts = {}) {
    return {
        type:        opts.type || "match",
        participants: opts.participants || (opts.w1 && opts.w2 ? [opts.w1, opts.w2] : []),
        // legacy mirror fields kept so old code paths still work:
        w1: opts.w1 || (opts.participants ? opts.participants[0] : null),
        w2: opts.w2 || (opts.participants ? opts.participants[1] : null),
        position:    opts.position || "undercard",
        isTitle:     !!opts.isTitle,
        // detailed-book extensions (ignored by current sim):
        stipulation: opts.stipulation || "standard",
        finish:      opts.finish || "sim",
        plannedWinner: opts.plannedWinner || null, // null = simulate winner
        timeBudget:  opts.timeBudget || (opts.position === "main" ? 20 : 10), // minutes, for pacing/fatigue
        storyBeats:  opts.storyBeats || []         // ["callback to last week", "betrayal tease", ...]
    };
}
